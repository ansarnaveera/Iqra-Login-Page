<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iqra University - Student Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="background"></div>

    <!-- Login Card -->
    <div class="login-card">

        <!-- University Logo -->
        <div class="logo-container">
            <img src="Iqra University Logo.jfif" alt="Iqra University Logo">
        </div>

        <!-- Heading -->
        <h1>Welcome to Iqra University</h1>

        <p class="subtitle">
            Login to access your student portal
        </p>


        <!-- Login Form -->
        <form action="dashboard.html">

            <!-- Username -->
            <div class="input-box">

                <span class="icon">👤</span>

                <input
                    type="text"
                    placeholder="Username or Email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="input-box">

                <span class="icon">🔒</span>

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <span class="eye">◉</span>

            </div>


            <!-- Remember + Forgot Password -->
            <div class="options">

                <label>
                    <input type="checkbox">
                    <span>Remember Me</span>
                </label>

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->
            <button type="submit" class="login-btn">
                <span>↪</span>
                Login
            </button>

        </form>


        <!-- OR Divider -->
        <div class="divider">

            <span></span>

            <p>OR</p>

            <span></span>

        </div>


        <!-- Sign Up Button -->
        <a href="signup.html" class="signup-btn">
            <span>♙</span>
            Sign Up
        </a>


        <!-- Bottom Text -->
        <p class="bottom-text">

            Not a student yet?

            <a href="signup.html">
                Create an account
            </a>

            to get started.

        </p>

    </div>

</body>

</html>
